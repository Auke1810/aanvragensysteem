# Bouwt de site bij elke push naar main en zet dist/ via FTP op Hostinger.
# Nodig in GitHub > Settings > Secrets and variables > Actions:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (uit hPanel > Bestanden > FTP-accounts)
#   PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_KEY
name: Deploy naar Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_KEY: ${{ secrets.PUBLIC_SUPABASE_KEY }}
      - name: Upload naar public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # Controleer in hPanel > Bestanden > FTP-accounts het veld "Folder to upload files".
          # Begint je FTP-account al in public_html, zet dit dan op ./
          server-dir: ./public_html/
